[package]
name = "lsm303-driver"
version = "0.1.0"
edition = "2024"


[features]
default = ["async"]
sync = ["embedded-hal"]
async = ["embedded-hal-async"]
# Derive `defmt::Format` on the public types. Off by default so users who log
# with something else (or not at all) don't have to link defmt.
defmt = ["dep:defmt"]

[dependencies]
embedded-hal = { version = "1", optional = true }
embedded-hal-async = { version = "1", optional = true }
defmt = { version = "1", optional = true }
maybe-async-cfg = "0.2"
