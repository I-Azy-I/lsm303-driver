[package]
name = "lsm303-driver"
version = "0.1.0"
edition = "2024"


[features]
default = ["async"]
sync = ["embedded-hal"]
async = ["embedded-hal-async"]
defmt = ["dep:defmt"]

[dependencies]
embedded-hal = { version = "1", optional = true }
embedded-hal-async = { version = "1", optional = true }
defmt = { version = "1", optional = true }
maybe-async-cfg = "0.2"
